# Documentation site: preview with `uv run mkdocs serve`, build with `uv run mkdocs build`.
# Published to GitHub Pages by .github/workflows/docs.yml.
site_name: DESTEST 3.0
site_description: Tools and web app for the District Energy Simulation Test Procedure
site_url: https://hichamjohra.github.io/DESTEST_3.0/
repo_url: https://github.com/HichamJohra/DESTEST_3.0
repo_name: HichamJohra/DESTEST_3.0
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      toggle:
        icon: material/weather-sunny
        name: Light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Checking submissions: checking.md
  - Naming convention: naming-convention.md
  - ResultMetadata files: result-metadata.md
  - Project structure: project-structure.md
  - Development: development.md
  - API reference: reference.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            members_order: source
            docstring_section_style: list
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

validation:
  links:
    not_found: warn
    anchors: warn
